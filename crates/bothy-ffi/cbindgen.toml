# Regenerate with: cbindgen --config cbindgen.toml --output include/bothy.h
language = "C"
include_guard = "BOTHY_H"
cpp_compat = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from crates/bothy-ffi/src/lib.rs. Do not edit. */"
header = """/*
 * Bothy C ABI: serverless, local-first sync over the user's own storage.
 * https://github.com/bothy-sync/bothy  (MIT OR Apache-2.0)
 *
 * Strings returned by bothy_* functions belong to the caller: free them with
 * bothy_string_free. On failure a function returns NULL or -1; bothy_last_error()
 * and bothy_last_error_kind() describe the failure (per thread).
 */"""
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"

[export]
include = ["BothyErrorKind"]
