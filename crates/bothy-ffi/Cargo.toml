[package]
name = "bothy-ffi"
description = "C ABI for Bothy, the serverless local-first sync engine (header: include/bothy.h)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "bothy_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "0.1"
bothy = { workspace = true }
serde_json = "1"

# The C ABI needs `unsafe` (raw pointers from C); the rest of the workspace forbids it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
